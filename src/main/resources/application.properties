spring.application.name=High_Grand

# --- TiDB Cloud (MySQL-compatible) ---
# Credentials are read from environment variables first (DB_USERNAME / DB_PASSWORD),
# then from the git-ignored src/main/resources/db.properties if present.
# Copy db.properties.example to src/main/resources/db.properties and fill in your values.
spring.config.import=optional:classpath:db.properties
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DB_USERNAME:${db.username:}}
spring.datasource.password=${DB_PASSWORD:${db.password:}}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: validate schema in prod-like runs; 'update' is convenient for the dev demo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- File uploads (product images) ---
# Container limit is generous; the 4 MB business rule is enforced in ProductService
# so oversized images get a friendly redirect instead of a raw Tomcat 413.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=-1