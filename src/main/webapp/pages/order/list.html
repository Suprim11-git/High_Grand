<script src="../../js/home.js"></script>


<script>

    async function loadOrders() {

        const orderList =
            document.getElementById("orderList");

        try {

            const response =
                await fetch("/api/orders/my");

            if (!response.ok) {

                if (response.status === 401 ||
                    response.status === 403) {

                    orderList.innerHTML = `
                            <div class="empty-orders">

                                <h3>
                                    Please log in
                                </h3>

                                <p>
                                    You need to log in
                                    to view your order history.
                                </p>

                                <a
                                    href="../auth/login.html"
                                    class="btn btn-outline">

                                    Login

                                </a>

                            </div>
                        `;

                    return;
                }

                throw new Error(
                    "Failed to load orders"
                );
            }


            const orders =
                await response.json();


            orderList.innerHTML = "";


            if (!orders ||
                orders.length === 0) {

                orderList.innerHTML = `

                        <div class="empty-orders">

                            <h3>
                                No orders yet
                            </h3>

                            <p>
                                You haven't placed
                                any orders yet.
                            </p>

                            <a
                                href="../product/category.html"
                                class="btn btn-outline">

                                Start Shopping

                            </a>

                        </div>

                    `;

                return;
            }


            // Display real orders
            orders.forEach(order => {

                const article =
                    document.createElement("article");

                article.className =
                    "order-card";


                const statusClass =
                    getStatusClass(order.status);


                article.innerHTML = `

                        <div>

                            <h3>
                                Order #${escapeHtml(
                    order.orderNumber || order.id || ""
                )}
                            </h3>

                            <p>
                                Placed on
                            ${formatDate(order.orderDate)}
                            </p>

                        </div>


                        <div class="order-items">

                            <strong>
                                Items
                            </strong>

                            ${formatItems(
                    order.itemsSummary
                )}

                        </div>


                        <p>
                            Rs. ${formatMoney(
                    order.totalAmount
                )}
                        </p>


                        <span
                            class="status ${statusClass}">

                            ${escapeHtml(
                    order.status || "Processing"
                )}

                        </span>


                        ${
                    order.trackingNumber
                        ?
                        `
                                <span class="tracking-number">
                                    Tracking:
                                    ${escapeHtml(
                            order.trackingNumber
                        )}
                                </span>
                            `
                        :
                        ""
                }

                    `;


                orderList.appendChild(article);

            });

        }

        catch (error) {

            console.error(
                "Order history error:",
                error
            );


            orderList.innerHTML = `

                    <div class="empty-orders">

                        <h3>
                            Unable to load orders
                        </h3>

                        <p>
                            Something went wrong while
                            loading your order history.
                        </p>

                        <button
                            class="btn btn-outline"
                            onclick="loadOrders()">

                            Try Again

                        </button>

                    </div>

                `;

        }

    }

    function formatItems(itemsSummary) {

        if (!itemsSummary ||
            itemsSummary.trim() === "") {

            return `
            <p>
                No item information available.
            </p>
        `;
        }

        const items = itemsSummary.split("|");

        return items.map(item => {

            item = item.trim();

            // New format:
            // productId:Product Name x quantity
            const separatorIndex = item.indexOf(":");

            if (separatorIndex === -1) {

                // Old orders do not contain product ID.
                return `
                <div class="order-item">
                    ${escapeHtml(item)}
                </div>
            `;
            }

            const productId =
                item.substring(0, separatorIndex).trim();

            const itemText =
                item.substring(separatorIndex + 1).trim();

            // Make sure the ID is actually numeric
            if (!/^\d+$/.test(productId)) {

                return `
                <div class="order-item">
                    ${escapeHtml(itemText)}
                </div>
            `;
            }

            return `
            <div class="order-item order-item-with-image">

                <img
                    src="/api/products/${productId}/image"
                    alt="Product"
                    class="order-history-product-img"
                    onerror="
                        this.onerror=null;
                        this.src='../../assets/images/logo.png';
                    "
                >

                <div class="order-history-product-details">
                    ${escapeHtml(itemText)}
                </div>

            </div>
        `;

        }).join("");

    }

    function formatDate(dateString) {

        if (!dateString) {
            return "Date unavailable";
        }


        const date =
            new Date(dateString);


        if (isNaN(date.getTime())) {
            return dateString;
        }

        return date.toLocaleDateString(
            "en-US",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        );

    }

    function formatMoney(amount) {

        if (amount === null ||
            amount === undefined) {

            return "0.00";
        }


        const number =
            Number(amount);


        if (isNaN(number)) {
            return "0.00";
        }


        return number.toFixed(2);

    }

    function getStatusClass(status) {

        if (!status) {
            return "status-processing";
        }

        const value =
            status.toLowerCase();


        if (value === "delivered") {
            return "status-delivered";
        }

        if (value === "shipped") {
            return "status-shipped";
        }


        if (value === "processing" ||
            value === "pending") {

            return "status-processing";
        }

        if (value === "cancelled" ||
            value === "canceled") {

            return "status-cancelled";
        }


        return "status-processing";

    }

    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {

            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

    document.addEventListener(
        "DOMContentLoaded",
        loadOrders
    );

</script>
