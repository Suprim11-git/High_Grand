<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | High Grand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/home.css">
    <link rel="stylesheet" href="../../css/pages.css">
    <link rel="stylesheet" href="../../css/login.css">
    <link rel="stylesheet" href="../../css/responsiveH.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <main>
        <div class="login-page-wrap">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-emblem">
                        <i class="fas fa-lock-open"></i>
                    </div>
                    <span class="section-label">Account Recovery</span>
                    <h1>Reset Password</h1>
                    <p>Enter your new password below to regain access to your account.</p>
                </div>

                <form class="login-form" id="resetForm" action="/reset-password" method="post">

                    <!-- Reset token from email link -->
                    <input type="hidden" id="token" name="token">

                    <div id="resetError" style="display: none; background: #fdecea; color: #b3261e; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem; font-weight: 500;">
                        <i class="fas fa-circle-exclamation" style="margin-right: 0.4rem;"></i>
                        <span id="resetErrorText"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">New Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" placeholder="Enter new password" minlength="6" required autocomplete="new-password">
                            <button type="button" class="password-toggle-btn" id="togglePassword" aria-label="Toggle password visibility">
                                <i class="far fa-eye" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm New Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" minlength="6" required autocomplete="new-password">
                            <button type="button" class="password-toggle-btn" id="toggleConfirm" aria-label="Toggle confirm password visibility">
                                <i class="far fa-eye" id="toggleConfirmIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login-submit">
                        <span>Reset Password</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <div class="login-footer-switch">
                        <p>Remembered your password? <a href="login.html">Back to Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 High Grand. All rights reserved.</p>
        </div>
    </footer>

    <script src="../../js/home.js"></script>

    <script>
        (function () {

            /* ── Token injection ── */
            var params =
                new URLSearchParams(window.location.search);

            var token = params.get('token');

            document.getElementById('token').value = token || '';

            /* ── Error messages ── */
            var errorBox =
                document.getElementById('resetError');

            var errorText =
                document.getElementById('resetErrorText');

            var errors = {
                password: 'Password must be at least 6 characters.',
                match:    'Passwords do not match.',
                invalid:  'This password reset link is invalid or has expired.'
            };

            var err = params.get('error');

            if (err && errors[err] && errorBox && errorText) {

                errorText.textContent = errors[err];
                errorBox.style.display = 'block';
            }

            /* ── Password toggle — New Password ── */
            (function setupToggle(btnId, iconId, inputId) {

                var btn   = document.getElementById(btnId);
                var icon  = document.getElementById(iconId);
                var input = document.getElementById(inputId);

                if (!btn || !icon || !input) { return; }

                btn.addEventListener('click', function () {

                    var isPassword =
                        input.getAttribute('type') === 'password';

                    input.setAttribute('type', isPassword ? 'text' : 'password');

                    icon.classList.toggle('fa-eye',      !isPassword);
                    icon.classList.toggle('fa-eye-slash', isPassword);
                });

            }('togglePassword', 'togglePasswordIcon', 'password'));

            /* ── Password toggle — Confirm Password ── */
            (function setupToggle(btnId, iconId, inputId) {

                var btn   = document.getElementById(btnId);
                var icon  = document.getElementById(iconId);
                var input = document.getElementById(inputId);

                if (!btn || !icon || !input) { return; }

                btn.addEventListener('click', function () {

                    var isPassword =
                        input.getAttribute('type') === 'password';

                    input.setAttribute('type', isPassword ? 'text' : 'password');

                    icon.classList.toggle('fa-eye',      !isPassword);
                    icon.classList.toggle('fa-eye-slash', isPassword);
                });

            }('toggleConfirm', 'toggleConfirmIcon', 'confirm_password'));

        })();
    </script>
</body>

</html>
