<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | High Grand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/home.css">
    <link rel="stylesheet" href="../../css/pages.css">
    <link rel="stylesheet" href="../../css/login.css">
    <link rel="stylesheet" href="../../css/responsiveH.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <main>
        <div class="login-page-wrap">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-emblem">
                        <i class="fas fa-key"></i>
                    </div>
                    <span class="section-label">Account Recovery</span>
                    <h1>Forgot Password?</h1>
                    <p>Enter your email address and we will send you a link to reset your password.</p>
                </div>

                <form class="login-form" id="forgotForm" action="/forgot-password" method="post">
                    <div id="forgotMessage" style="display: none; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem; font-weight: 500;">
                        <i class="fas fa-circle-exclamation" style="margin-right: 0.4rem;"></i>
                        <span id="forgotMessageText"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-with-icon">
                            <i class="far fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" placeholder="Enter your email address" required autocomplete="email">
                        </div>
                    </div>

                    <button type="submit" class="btn-login-submit">
                        <span>Send Reset Link</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>

                    <div class="login-footer-switch">
                        <p>Remembered your password? <a href="login.html">Back to Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 High Grand. All rights reserved.</p>
        </div>
    </footer>

    <script src="../../js/home.js"></script>

    <script>
        (function () {

            var params =
                new URLSearchParams(window.location.search);

            var messageBox =
                document.getElementById('forgotMessage');

            var messageText =
                document.getElementById('forgotMessageText');

            if (params.get('sent') === 'true' &&
                messageBox &&
                messageText) {

                messageText.textContent =
                    'Password reset link has been sent to your email. Please check your inbox.';

                messageBox.style.background = '#edf7f0';
                messageBox.style.color = '#1a6b3c';
                messageBox.querySelector('i').className = 'fas fa-circle-check';
                messageBox.style.display = 'block';
            }

            if (params.get('error') === 'not_found' &&
                messageBox &&
                messageText) {

                messageText.textContent =
                    'No account was found with that email address.';

                messageBox.style.background = '#fdecea';
                messageBox.style.color = '#b3261e';
                messageBox.style.display = 'block';
            }

            if (params.get('error') === 'email' &&
                messageBox &&
                messageText) {

                messageText.textContent =
                    'Please enter your email address.';

                messageBox.style.background = '#fdecea';
                messageBox.style.color = '#b3261e';
                messageBox.style.display = 'block';
            }

        })();
    </script>
</body>

</html>
