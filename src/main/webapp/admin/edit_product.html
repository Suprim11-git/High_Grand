<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - High Grand Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body data-page="edit">

    <div class="announcement-bar">
        <p>High Grand Admin &nbsp;|&nbsp; Smart E-Commerce Management</p>
    </div>

    <div class="admin-shell">
        <aside class="sidebar">
            <a href="dashboard.html" class="sidebar-brand">
                <img src="../assets/images/logo.png" alt="High Grand logo">
                <span class="brand-name">HIGH GRAND</span>
            </a>
            <span class="sidebar-label">Admin Panel</span>

            <nav aria-label="Admin navigation">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="products.html" class="active"><i class="fas fa-bag-shopping"></i> Products</a>
                <a href="categories.html"><i class="fas fa-layer-group"></i> Categories</a>
                <a href="orders.html"><i class="fas fa-receipt"></i> Orders</a>
                <a href="inventory.html"><i class="fas fa-boxes-stacked"></i> Inventory</a>
                <a href="users.html"><i class="fas fa-users"></i> Users</a>
            </nav>

            <div class="sidebar-footer">
                <a href="../Home.html"><i class="fas fa-store"></i> View storefront</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1>Edit Product</h1>
                    <p>Modify catalog specifications, pricing, inventory, and imagery.</p>
                </div>
                <div class="header-actions">
                    <a href="products.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to Products</a>
                    <button type="button" class="btn btn-danger" id="deleteProductBtn"><i class="fas fa-trash"></i> Delete</button>
                </div>
            </header>

            <div id="editLoadingState" style="display:none; text-align:center; padding: 3rem 1rem; color: var(--color-text-muted);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem; display:block;"></i>
                <p style="margin:0;">Loading product details…</p>
            </div>

            <div class="form-card" id="editFormCard" style="max-width: 760px; display:none;">
                <form class="admin-form" action="/admin/update_product" method="post" enctype="multipart/form-data">
                        <input type="hidden" name="id" id="productId" value="">
                    <div>
                        <label for="productName">Product Name *</label>
                        <input type="text" id="productName" name="productName" value="" required>
                    </div>

                    <div class="form-row-2">
                        <div>
                            <label for="category">Category *</label>
                            <select id="category" name="category" data-category-options required>
                                <option value="">Select Category</option>
                                <option value="Footwear">Footwear</option>
                                <option value="Men's Wear">Men's Wear</option>
                                <option value="Women's Wear">Women's Wear</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Fragrances">Fragrances</option>
                                <option value="Bags & Leather">Bags & Leather</option>
                            </select>
                        </div>

                        <div>
                            <label for="sku">SKU Identifier *</label>
                            <input type="text" id="sku" name="sku" value="" required>
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div>
                            <label for="price">Regular Price (Rs.) *</label>
                            <input type="number" id="price" name="price" min="0" step="0.01" value="" required>
                        </div>

                        <div>
                            <label for="salePrice">Sale / Promotional Price (Rs.)</label>
                            <input type="number" id="salePrice" name="salePrice" min="0" step="0.01" value="">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div>
                            <label for="stock">Current Stock Quantity *</label>
                            <input type="number" id="stock" name="stock" min="0" value="" required>
                        </div>

                        <div>
                            <label for="minStock">Low Stock Threshold</label>
                            <input type="number" id="minStock" name="minStock" min="0" value="5">
                        </div>
                    </div>

                    <div>
                        <label for="image">Replace Product Image</label>
                        <input type="file" id="image" name="image" accept="image/*">
                        
                        <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
                            <img id="imagePreview" src="" alt="Product preview">
                            <p style="font-size: 0.75rem; color: var(--color-text-muted); margin-top: 0.4rem;"></p>
                        </div>
                    </div>

                    <div>
                        <label for="status">Publication Status</label>
                        <select id="status" name="status">
                            <option value="Active" selected>Active (Visible in Store)</option>
                            <option value="Draft">Draft (Hidden)</option>
                            <option value="Archived">Archived</option>
                        </select>
                    </div>

                    <div>
                        <label for="description">Product Description & Craftsmanship</label>
                        <textarea id="description" name="description"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Save Changes</button>
                        <a href="products.html" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
</body>

</html>
