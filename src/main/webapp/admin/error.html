<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong - High Grand Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body data-page="error">

    <div class="announcement-bar">
        <p>High Grand Admin &nbsp;|&nbsp; Smart E-Commerce Management</p>
    </div>

    <div class="admin-shell">
        <aside class="sidebar">
            <a href="dashboard.html" class="sidebar-brand">
                <img src="../assets/images/logo.png" alt="High Grand logo">
                <span class="brand-name">HIGH GRAND</span>
            </a>
            <span class="sidebar-label">Admin Panel</span>

            <nav aria-label="Admin navigation">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-bag-shopping"></i> Products</a>
                <a href="categories.html"><i class="fas fa-layer-group"></i> Categories</a>
                <a href="orders.html"><i class="fas fa-receipt"></i> Orders</a>
                <a href="inventory.html"><i class="fas fa-boxes-stacked"></i> Inventory</a>
                <a href="users.html"><i class="fas fa-users"></i> Users</a>
            </nav>

            <div class="sidebar-footer">
                <a href="../Home.html"><i class="fas fa-store"></i> View storefront</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1 id="errorTitle">Something Went Wrong</h1>
                    <p id="errorMsg">The request could not be completed. Please try again.</p>
                </div>
                <div class="header-actions">
                    <a href="products.html" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back to Products</a>
                </div>
            </header>

            <div class="form-card" style="max-width: 640px;">
                <div style="text-align: center; padding: 2rem 1rem;">
                    <i class="fas fa-triangle-exclamation" style="font-size: 3rem; color: var(--color-gold); margin-bottom: 1rem;"></i>
                    <h2 id="errorHeading" style="font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 0.75rem;">Action Failed</h2>
                    <p id="errorDetail" style="color: var(--color-text-muted); margin-bottom: 1.5rem;"></p>
                    <div class="form-actions" style="justify-content: center;">
                        <a href="javascript:history.back()" class="btn btn-outline"><i class="fas fa-rotate-left"></i> Go Back</a>
                        <a href="add_products.html" class="btn btn-primary"><i class="fas fa-plus"></i> Try Add Product Again</a>
                    </div>
                    <p id="errorHint" style="font-size: 0.8rem; color: var(--color-text-muted); margin-top: 1.5rem;"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        (function () {
            const p = new URLSearchParams(window.location.search);
            const title = p.get('title') || 'Something Went Wrong';
            const msg = p.get('msg') || 'The request could not be completed.';
            const hint = p.get('hint');
            document.title = title + ' - High Grand Admin';
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMsg').textContent = msg;
            document.getElementById('errorHeading').textContent = title;
            document.getElementById('errorDetail').textContent = msg;
            const h = document.getElementById('errorHint');
            if (hint) {
                h.textContent = hint;
            } else {
                h.remove();
            }
        })();
    </script>
</body>

</html>
